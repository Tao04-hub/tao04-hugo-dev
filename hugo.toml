baseURL                = "https://Tao04-hub.github.io/Tao04-hugo-dev"
languageCode           = "zh"
title                  = "Tao04"
# Theme i18n support
# See i18n folder for available languages
defaultContentLanguage = "zh"
# Set hasCJKLanguage to true if DefaultContentLanguage is a CJK language
# This will make .Summary and .WordCount behave correctly
hasCJKLanguage         = true

theme = "hugo-theme-stack"

# [[module.imports]]
#     path = "github.com/CaiJimmy/hugo-theme-stack/v3"

[pagination]
    pagerSize = 2

[permalinks]
    post = "/p/:slug/"
    page = "/:slug/"

# [services.disqus]
#     shortname = "hugo-theme-stack"

# ========== Stack 主题专属细节配置（新增） ==========
[params]
    # 1. 首页基础配置
    title = "Tao04 的博客"          # 首页大标题（替代默认的站点标题）
    subtitle = "专注前端学习与分享"  # 首页副标题
    description = "一个基于 Hugo Stack 主题的个人博客"  # 站点描述（SEO 友好）

    # 2. 导航栏配置（显示“首页、分类、标签、关于我”）
    [[params.menu.main]]
        identifier = "home"
        name = "首页"
        url = "/"
        weight = 10  # 排序权重（数字越小越靠前）
    [[params.menu.main]]
        identifier = "categories"
        name = "分类"
        url = "/categories/"
        weight = 20
    [[params.menu.main]]
        identifier = "tags"
        name = "标签"
        url = "/tags/"
        weight = 30
    [[params.menu.main]]
        identifier = "about"
        name = "关于我"
        url = "/about/"
        weight = 40

    # 3. 外观细节
    darkMode = "auto"  # 深色模式：auto（跟随系统）/ light（浅色）/ dark（深色）
    colorScheme = "auto"  # 配色方案：auto/light/dark
    featuredImage = true  # 文章是否显示首图
    toc = true  # 文章页是否显示目录

    # 4. 社交链接（首页底部显示）
    [[params.social]]
        name = "GitHub"
        icon = "github"
        url = "https://github.com/Tao04-hub"
    [[params.social]]
        name = "邮箱"
        icon = "email"
        url = "mailto:你的邮箱@xxx.com"

